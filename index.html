<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather_4caster</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>ForCaster</h1>
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Enter city name">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </header>

        <main>
            <section class="current-weather">
                <div class="weather-card">
                    <div class="weather-header">
                        <h2 id="city-name">City Name</h2>
                        <p id="current-date">Date</p>
                    </div>
                    <div class="weather-body">
                        <div class="temp-container">
                            <h1 id="temperature">--°C</h1>
                            <div class="hi-lo">
                                <span id="temp-max">--°C</span> / <span id="temp-min">--°C</span>
                            </div>
                        </div>
                        <div class="weather-icon">
                            <img id="weather-icon" src="" alt="Weather Icon">
                            <p id="weather-description">Description</p>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail">
                            <i class="fas fa-wind"></i>
                            <span id="wind-speed">-- m/s</span>
                        </div>
                        <div class="detail">
                            <i class="fas fa-tint"></i>
                            <span id="humidity">--%</span>
                        </div>
                        <div class="detail">
                            <i class="fas fa-sun"></i>
                            <span id="uv-index">--</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="forecast">
                <h3>5-Day Forecast</h3>
                <div class="forecast-container" id="forecast-container">

                </div>
            </section>
        </main>

        <footer>
            <p>Created by <span id="your-name">Mokhtar Lahjaily</span> | <a href="https://github.com/MokhtarLahjaily" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
